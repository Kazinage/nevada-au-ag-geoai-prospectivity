[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-nevada"
version = "0.1.0"
description = "Spatially honest, AOA-constrained GeoAI utilities for mineral prospectivity mapping."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alisher Saduov"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "shap>=0.45",
  "joblib>=1.3"
]

[tool.setuptools.packages.find]
where = ["src"]
